input {
    jdbc {
        # host.docker.internal: trỏ tới máy host (MySQL đang chạy local, không phải trong container)
        jdbc_connection_string => "jdbc:mysql://mysql:3306/user_db?useSSL=false&serverTimezone=UTC"
        jdbc_user => "root"
        jdbc_password => "${MYSQL_PASSWORD}"
        jdbc_driver_library => "/usr/share/logstash/logstash-core/lib/mysql-connector-java-8.0.26.jar"
        jdbc_driver_class => "com.mysql.cj.jdbc.Driver"

        # Bảng "users" trong UserService (user_db) - xem UserService/src/main/java/com/vti/entity/User.java
        statement => "SELECT id, username, email, full_name, phone, status, created_at, updated_at FROM users WHERE created_at > :sql_last_value ORDER BY created_at"

        use_column_value => true
        tracking_column => created_at
        tracking_column_type => "timestamp"

        # 1 phút chạy lại 1 lần để lấy user mới đăng ký
        schedule => "* * * * *"
    }
    tcp {
        port => 5044
        codec => json
    }
}

filter {
    # Không cần transform gì đặc biệt, giữ nguyên các field
}

output {
    elasticsearch {
        index => "users-%{+YYYY.MM.dd}"
        hosts => ["http://elasticsearch:9200"]
        action => "index"
        document_id => "%{id}"
        doc_as_upsert => true
    }

    # Bỏ comment dòng dưới nếu muốn xem log Logstash đang xử lý dữ liệu gì trong console
    # stdout { codec => rubydebug }
}
